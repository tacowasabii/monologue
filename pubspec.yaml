name: monologue
description: "모노로그 — 사진으로 모으는 독백 대본 노트"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.13.3

dependencies:
  app_links: ^7.2.1
  archive: ^4.2.0
  characters: ^1.4.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  # 고운바탕(OFL)을 KS X 1001 한글 2,350자 + 라틴·문장부호로 줄였다. 없는 글자는 시스템 글꼴로 나온다.
  fonts:
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/GowunBatang-Regular.ttf
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#7A4B5C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
